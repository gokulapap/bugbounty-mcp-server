[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbounty-mcp-server"
version = "2.1.0"
description = "Scope-safe Model Context Protocol server for authorized bug bounty reconnaissance, scanning, and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gokul AP", email = "apgokul008@gmail.com" }]
keywords = ["mcp", "security", "bug-bounty", "reconnaissance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "click>=8.1,<9",
    "cryptography>=50,<51",
    "dnspython>=2.6,<3",
    "jsonschema>=4.23,<5",
    "mcp>=2.0,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "twine>=6,<7",
    "pip-audit>=2.9,<3",
    "types-jsonschema>=4.23,<5",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
bugbounty-mcp = "bugbounty_mcp_server.cli:main"

[project.urls]
Homepage = "https://github.com/gokulapap/bugbounty-mcp-server"
Documentation = "https://github.com/gokulapap/bugbounty-mcp-server#readme"
Repository = "https://github.com/gokulapap/bugbounty-mcp-server"
Issues = "https://github.com/gokulapap/bugbounty-mcp-server/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bugbounty_mcp_server*"]

[tool.setuptools.package-data]
bugbounty_mcp_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["bugbounty_mcp_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 83

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101",
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]
